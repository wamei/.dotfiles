# dotfiles のセットアップを mise の native bootstrap に寄せる。
#
# `mise bootstrap` が宣言を順に、冪等に適用する。実行はこのファイルのある
# ディレクトリ (リポジトリ直下) で行うこと。mise は cwd の設定階層をマージ
# するので、リポジトリ外から実行すると [bootstrap.*] が見えない。
#
#   mise bootstrap        適用
#   mise bootstrap -n     dry-run (適用せず差分だけ表示)
#   mise bootstrap status 収束状態の確認
#   mise run update       brew と mise の管理下をまとめて最新化
#
# ランタイム定義 ([tools] / [settings]) はこのファイルではなく
# .config/mise/config.toml にある。あちらは ~/.config/mise/config.toml へ
# symlink されるグローバル設定で、どのディレクトリでもツールが解決する。
# .zshrc の show_env_mise がそのパスを基準に「global 由来か」を判定している
# ため、[tools] をこちらへ移すとプロンプトの表示が壊れる。

# verify タスクの `mise config explain` と、dry-run が [tasks.bootstrap] を実行せず
# 表示だけに留める挙動が、この版を前提にしている。
min_version = "2026.10.14"

# ---------------------------------------------------------------------------
# system packages (旧 README の brew install 手順)
#
# 注: mise の brew backend は brew CLI を呼ばず Homebrew API から直接メタデータを
# 取り bottle を展開する。brew にフォールバックすることはない。cask は artifact
# 種別のカバー範囲が狭く、扱えないものは下の [tasks.bootstrap] で brew install に
# 退避してある。
#
# adopt = true は必須。mise が cask を入れ直すと /Applications/*.app が置き換わり、
# macOS の TCC 権限 (アクセシビリティ・画面収録・フルディスクアクセス) がリセット
# される。karabiner-elements・ghostty・1password が直撃する。adopt は既存バンドルを
# 差し替えず所有権だけ記録する。
# ---------------------------------------------------------------------------
[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"laishulu/homebrew" = "https://github.com/laishulu/homebrew-homebrew"
"d12frosted/emacs-plus" = "https://github.com/d12frosted/homebrew-emacs-plus"

[bootstrap.packages]
# --- formula: mise に移せなかったもの ---
# mise 本体 (自己参照なので mise では入れられない)
#
# ここに並ぶ brew: の formula は brew で上げる (`mise run update`)。
# `mise bootstrap packages upgrade` や `mise bootstrap --upgrade` で上げてはいけない。
# mise の brew backend は bin/share などは張り替えるが etc/ をリンクしない
# (2026.10.17 の pour.rs の LINK_DIRS)。mise を上げると etc/bash_completion.d/mise
# だけが旧 keg を指したまま残り、次の brew upgrade がその etc/ の衝突で link 全体を
# 巻き戻して /opt/homebrew/bin/mise が消える (2026-10-22 に実際に起きた)。
"brew:mise" = "latest"
# zsh プラグイン。バイナリでなく .zshrc が $HOMEBREW_PREFIX/share/ を source する
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-autocomplete" = "latest"
"brew:zsh-completions" = "latest"
# ライブラリ + psql。aqua registry に無い。.zshrc が PATH に入れ、Emacs の
# sql-mode が psql を引く
"brew:libpq" = "latest"
# Emacs の minibuffer で IME を off にする。tap のソースビルド
"brew:laishulu/homebrew/macism" = "latest"
# 以下は aqua registry にエントリが無い
"brew:timg" = "latest"      # ghostel に kitty graphics で画像を出す

# --- cask ---
# emacs-plus-app は d12frosted/emacs-plus tap の cask。mise の brew backend は
# formulae.brew.sh の API しか見ないため、tap が api/cask/<token>.json を出して
# いない cask は 404 で解決できない。brew install --cask に退避。
# "brew-cask:emacs-plus-app" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:google-chrome@canary" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:orbstack" = "latest"
"brew-cask:postman" = "latest"
"brew-cask:background-music" = "latest"
# フォント
"brew-cask:font-blex-mono-nerd-font" = "latest"
"brew-cask:font-hackgen" = "latest"
"brew-cask:font-hackgen-nerd" = "latest"
"brew-cask:font-source-han-code-jp" = "latest"
"brew-cask:font-udev-gothic" = "latest"
"brew-cask:font-udev-gothic-nf" = "latest"

# ---------------------------------------------------------------------------
# $HOME への symlink (旧 init.sh の ln -sf)
# source はこのファイルのあるディレクトリからの相対
# ---------------------------------------------------------------------------
[dotfiles]
"~/.inputrc" = { source = ".inputrc", mode = "symlink" }
"~/.zshenv" = { source = ".zshenv", mode = "symlink" }
"~/.zshrc" = { source = ".zshrc", mode = "symlink" }
"~/.tmux.conf" = { source = ".tmux.conf", mode = "symlink" }
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml", mode = "symlink" }
"~/.config/yamllint/config" = { source = ".config/yamllint/config", mode = "symlink" }
"~/.aws/update-mfa-profile" = { source = ".aws/update-mfa-profile", mode = "symlink" }
"~/.emacs.d/init.el" = { source = ".emacs.d/init.el", mode = "symlink" }
"~/.emacs.d/early-init.el" = { source = ".emacs.d/early-init.el", mode = "symlink" }
"~/bin/rpbcopy" = { source = "bin/rpbcopy", mode = "symlink" }
# GNU ls の代わりに mise の uutils coreutils を呼ぶラッパ。.zshrc の ls
# エイリアスと Emacs の dired (.emacs.d/dired-gnu-ls.el) が gls を引く。
# brew の coreutils を [tools] の aqua:uutils/coreutils に移した際、brew 版の
# uninstall で /opt/homebrew/bin/gls が消えたため、その代替として要る。
"~/bin/gls" = { source = "bin/gls", mode = "symlink" }
# ~/projects のプロジェクトを ghq レイアウトへ移し、Claude のセッション履歴を
# 追随させる 2 本。分かれているのは ~/.claude.json が Claude 起動中ずっと
# 書き戻されており、移動と同じタイミングでは触れないため。
"~/bin/project-move" = { source = "tools/project-move/cli/project-move.ts", mode = "symlink" }
"~/bin/claude-state-move" = { source = "tools/project-move/cli/claude-state-move.ts", mode = "symlink" }
"~/.config/karabiner/assets/complex_modifications/ja.json" = { source = ".config/karabiner/assets/complex_modifications/ja.json", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.gitignore" = { source = ".gitignore_global", mode = "symlink" }
# Claude Code のユーザー設定。リポジトリの .claude/ に置くとこの repo を開いたときに
# project 設定として二重に読まれる (hook が 2 回走る) ので claude/ に置く。
"~/.claude/CLAUDE.md" = { source = "claude/CLAUDE.md", mode = "symlink" }
"~/.claude/settings.json" = { source = "claude/settings.json", mode = "symlink" }
# グローバルの skill 宣言。`apm install -g` で ~/.claude/skills/ に deploy される。
"~/.apm/apm.yml" = { source = ".apm/apm.yml", mode = "symlink" }

# ---------------------------------------------------------------------------
# macOS のシステム設定
#
# Dock のアプリ並びは [bootstrap.macos.dock] で宣言できるが、意図して手で管理している
# (Chrome の PWA など、マシンごとに入っているものが違うため)。
#
# 反映には killall が要る。mise 自身はアプリを落とさないので hook で行う。
# ---------------------------------------------------------------------------
[bootstrap.macos.defaults]
# ApplePressAndHold を切るのは、長押しでアクセント候補を出さずキーリピートさせるため
# (Emacs で必須)。fnState は F1-F12 をファンクションキーとして扱う。
# mise は TOML の型どおりに書き、plist の型が違えば `2 (real; expected integer)` のように
# 差分として報告する。KeyRepeat/InitialKeyRepeat と tilesize は System Settings の
# スライダーを動かすと float で書き戻されるので、そのときは整数で書き直される。
"NSGlobalDomain" = { KeyRepeat = 2, InitialKeyRepeat = 30, ApplePressAndHoldEnabled = false, NSAutomaticCapitalizationEnabled = false, "com.apple.keyboard.fnState" = true }
"com.apple.dock" = { autohide = true, tilesize = 64 }
"com.apple.finder" = { AppleShowAllFiles = true, FXPreferredViewStyle = "Nlsv" }

[bootstrap.hooks]
post-defaults = "killall Dock Finder || true"

# ---------------------------------------------------------------------------
# ログインシェル (旧 init.sh には無く、手で chsh していた)
# ---------------------------------------------------------------------------
[bootstrap.user]
login_shell = "/bin/zsh"

# ---------------------------------------------------------------------------
# 宣言で表せない補助 (bootstrap の step 15 で自動実行される escape hatch)
# 冪等に保つこと。毎回実行される。
# ---------------------------------------------------------------------------
[tasks.bootstrap]
description = "mise の brew backend で扱えないパッケージを brew から入れる"
run = [
  # emacs-plus-app: d12frosted/emacs-plus tap の cask。mise の brew backend では
  # 入れられない (2026.10.14 で実測)。
  #   "brew-cask:emacs-plus-app"   formulae.brew.sh の API を引いて 404
  #   "brew-cask:d12frosted/emacs-plus/emacs-plus-app"
  #                                tap の Ruby 定義を mise 自身が評価するが、
  #                                `version.sub` が未実装で NoMethodError
  # tap 自体は上の [bootstrap.brew.taps] が先に済ませるので、ここは token 指定で足りる。
  #
  # brew list --cask で先に存在を見てから install する。`brew install --cask` は
  # 「導入済みなら何もしない」ではなく、導入済みでも版が古ければその場で
  # アップグレードする (実測: 31.1-319 → 31.1-327 に入れ替わった)。cask の
  # アップグレードは /Applications/Emacs.app を丸ごと差し替えるので、この
  # ファイル冒頭に書いたのと同じ TCC リセットが Emacs.app にも起きる。
  # bootstrap は毎回走る以上、ここは「無ければ入れる」だけに留める。
  # 更新は `mise run update` (brew upgrade) 側の明示操作に委ねる。
  "command -v brew >/dev/null 2>&1 && { brew list --cask emacs-plus-app >/dev/null 2>&1 || brew install --cask emacs-plus-app; } || true",
]

# ---------------------------------------------------------------------------
# 設定の妥当性検証 (非破壊)
#   mise run verify
#
# [dotfiles] のエントリ内の未知キーは bootstrap も dry-run も警告なしに無視する
# (mode の綴りミスは既定値へ黙ってフォールバックする)。目視レビューでは誤りを
# 検出できないので、mise config explain で機械的に検出する。
# ---------------------------------------------------------------------------
[tasks.verify]
description = "設定の妥当性を検証する (非破壊)"
run = [
  # mise が読まないキーを列挙し、1 つでもあれば非ゼロで終了する。
  # config explain はテキスト出力だと未知キーがあっても exit 0 なので、JSON の
  # known を jq で判定する。
  '''
status=0
for f in mise.toml .config/mise/config.toml; do
  unknown=$(mise config explain --file "$f" --json | jq -r '.[] | select(.known == false) | "\(.line): \(.key)"')
  if [ -n "$unknown" ]; then
    echo "$f: mise が読まないキーがある" >&2
    echo "$unknown" | sed "s|^|  $f:|" >&2
    status=1
  fi
done
exit $status
''',
  # bootstrap 全体の dry-run。パッケージトークンの解決、[dotfiles] の source 存在、
  # defaults の妥当性、login shell、tools の解決までを一括で検証する。
  # 不正な設定があれば非ゼロで終了する。
  #
  # --force-dotfiles を付けるのは「既存ファイルを壊す」検査を黙らせるためではなく、
  # その検査が環境依存で偽陽性になるため。~/.config などは実ディレクトリとして
  # 存在しがちで、素の環境では必ず衝突として報告される。ここで検証したいのは設定の
  # 妥当性であって実行環境の状態ではない。dry-run なので何も書き換わらない。
  #
  # [tasks.bootstrap] と [bootstrap.hooks] は -n では表示されるだけで実行されない
  # (2026.10.14 で、touch するだけのタスクと hook を隔離環境で走らせて確認)。
  # dry-run は段ごとに最初のエラーで止まるので、後ろの段の誤りは前の段を直すまで
  # 見えないことがある。
  "mise bootstrap -n --force-dotfiles",
]

# ---------------------------------------------------------------------------
# 日常の更新
#   mise run update
#
# 更新経路が 3 系統に分かれており、どれか 1 つでは全部は上がらない:
#   1. brew   [bootstrap.packages] の formula / cask と mise 本体。
#             mise bootstrap は導入済みならスキップするだけでアップグレードしない
#             ので、これらを上げられるのは brew だけ。
#   2. mise upgrade
#             .config/mise/config.toml の [tools]。"latest" 指定なので最新へ上がる。
#   3. mise run bootstrap
#             brew backend で扱えず退避したものの導入。冪等。
#
# 注: 対話的に (自分のシェルから) 実行すること。自己更新機構を持つ cask
# (Slack / Google Chrome) は /Applications 配下が root:wheel になっており
# chown に sudo が要る。先に `sudo -v` を済ませ、対象アプリは終了しておく。
#
# --greedy は付けない。--greedy は auto_updates 済み cask も対象にするが、それは
# 「アプリ自身が更新機構を持つので brew は手を出さない」という cask 側の宣言を
# 上書きすることに他ならない。実測: karabiner-elements は brew の Caskroom には
# 14.12.0 のままだが、実体は自己更新で 16.3.0 まで進んでいる。auto_updates な
# ので --greedy 無しの brew upgrade --cask はこれをスキップし続け、その食い違いは
# 無害なまま放置される。ここで --greedy を付けると brew が
# /Applications/Karabiner-Elements.app を丸ごと差し替え、[bootstrap.brew] の
# adopt = true のコメントに書いたのと同じ TCC リセット (Accessibility 等の
# 許可が失効し、再許可が要る) をこのアプリにも起こす。この計画は
# /Applications/Emacs.app で同じ事故を一度起こしている。--greedy を付けないのは
# スタイルの問題ではなく、この再発を防ぐための明示的な選択。
# ---------------------------------------------------------------------------
[tasks.update]
description = "brew と mise の管理下をまとめて最新化する"
run = [
  '''
if command -v brew >/dev/null 2>&1; then
  brew update
  # cask は対象アプリが起動していると chown に失敗し、その 1 本のために brew 全体が
  # 非ゼロで終わる。ここで止めると後続の mise upgrade まで巻き添えになるので、案内
  # だけ出して先へ進める。
  brew upgrade || echo "brew upgrade: 一部失敗。起動中のアプリを終了してから brew upgrade を流し直すこと。"
  # mise の link が失敗すると bin/mise が消え、後続の mise upgrade と
  # mise run bootstrap が全部落ちる (brew:mise のコメント参照)。衝突するのは mise
  # 自身の旧 keg へのリンクだけなので、--overwrite で張り直してよい。
  [ -e "$(brew --prefix)/bin/mise" ] || brew link --overwrite mise
else
  echo "brew not found; skipping system packages"
fi
''',
  "mise upgrade",
  "mise run bootstrap",
]

# ---------------------------------------------------------------------------
# tools/ のユニットテスト
# ---------------------------------------------------------------------------
[tasks.test]
description = "tools/ のユニットテストを走らせる"
run = [
  "cd tools/project-move && bun test",
  "cd tools/org-notes-sync && bun test",
]

[tasks."org-notes-sync:install"]
description = "org-notes-sync をビルドして ~/.local/bin に入れ、plist を置く (launchd には読み込まない)"
dir = "{{config_root}}"
run = ["sh tools/org-notes-sync/install.sh"]

[tasks."org-notes-sync:enable"]
description = "org-notes-sync を入れた上で launchd に読み込む"
dir = "{{config_root}}"
run = ["sh tools/org-notes-sync/install.sh --load"]
